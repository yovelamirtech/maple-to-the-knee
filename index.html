<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#14130f" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)">
  <title>Maple to the Knee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div class="container header-row">
      <div class="brand">
        <h1 class="title"><span aria-hidden="true">🍁</span> <bdi dir="ltr">Maple to the Knee</bdi></h1>
        <p class="subtitle" id="build-name"></p>
      </div>
    </div>
  </header>

  <main class="container" id="main">
    <section class="stage-head" id="stage-head" aria-live="polite"></section>
    <div id="banner"></div>
    <div id="list"></div>
    <noscript><p class="empty">האתר דורש JavaScript.</p></noscript>
  </main>

  <footer class="container footer">
    <p>מדריך אישי לא רשמי. המידע מבוסס על מקורות קהילה ונבדק מול המקורות הרשמיים כשאפשר.</p>
    <p>המשחק <bdi>MapleStory</bdi> הוא <bdi>© Nexon</bdi>.</p>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <span class="toast-text" id="toast-text"></span>
    <button type="button" class="toast-undo" id="toast-undo">ביטול</button>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
